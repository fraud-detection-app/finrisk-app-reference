[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrisk-app"
version = "0.1.0"
description = "The fraud-risk service: score, explain, ask. Reads its model and knowledge index from SSM pointers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhitongguigu VIP Course" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
